<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Erwachsenen-Ausflugsziele Karte</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2b4a7a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Erwachsene">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --bg: #f7f7f5;
    --panel: #ffffff;
    --border: #e2e2e0;
    --text: #2b2b28;
    --text-muted: #6b6b66;
    --accent: #2f6f4f;
    --accent-hover: #24583e;
    --chip-bg: #eef0ec;
    --chip-active-bg: #2f6f4f;
    --chip-active-text: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #app { display: flex; flex-direction: column; height: 100vh; }

  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 6px 14px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex-shrink: 0;
  }
  header h1 { font-size: 13.5px; margin: 0; font-weight: 700; display: inline; }
  header .sub { font-size: 10.5px; color: var(--text-muted); margin-left: 8px; }
  .stats-bar { font-size: 10.5px; color: var(--accent-hover); font-weight: 600; margin-left: 8px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .search-box {
    padding: 4px 8px;
    border: 1px solid var(--border);
    border-radius: 7px;
    font-size: 12px;
    min-width: 180px;
    flex: 1 1 200px;
    max-width: 300px;
  }
  .ai-box {
    padding: 4px 8px;
    border: 1px solid var(--accent);
    border-radius: 7px;
    font-size: 12px;
    min-width: 220px;
    flex: 1 1 240px;
    max-width: 380px;
    background: #f4f9f5;
  }
  .ai-feedback { font-size: 10.5px; color: var(--accent-hover); min-height: 12px; }
  #tablePane { display: none; flex: 1; overflow: auto; padding: 10px 14px; background: var(--panel); }
  body.table-mode #tablePane { display: block; }
  body.table-mode #map-pane, body.table-mode #list-pane { display: none; }
  body.list-only #map-pane { display: none; }
  body.list-only #list-pane { flex: 1; border-left: none; border-top: none; }
  body.list-only .card-list { max-width: 900px; margin: 0 auto; }
  .view-seg { display: inline-flex; border: 1px solid var(--border); border-radius: 18px; overflow: hidden; background: var(--chip-bg); }
  .view-seg button { border: none; background: none; font: inherit; font-size: 11.5px; padding: 3px 10px; color: var(--text); cursor: pointer; white-space: nowrap; }
  .view-seg button + button { border-left: 1px solid var(--border); }
  .view-seg button.on { background: var(--chip-active-bg); color: var(--chip-active-text); }
  .cmp-title { font-size: 13.5px; font-weight: 700; margin: 6px 0 6px; }
  .cmp-table { border-collapse: collapse; width: 100%; font-size: 12.5px; margin-bottom: 20px; }
  .cmp-table th { text-align: left; font-weight: 600; color: var(--text-muted); padding: 6px 8px; border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; white-space: nowrap; }
  .cmp-table th.sorted { color: var(--accent-hover); }
  .cmp-table td { padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .cmp-table td.nm { font-weight: 600; min-width: 160px; }
  .cmp-table td.nm a { color: inherit; text-decoration: none; }
  .cmp-table td.nm a:hover { text-decoration: underline; }
  .cmp-table .na { color: var(--text-muted); }
  .cmp-table .src { font-weight: 400; margin-left: 4px; color: var(--text-muted); }
  .cmp-note { font-size: 11px; color: var(--text-muted); margin: 0 0 10px; }
  @media (max-width: 760px) {
    .cmp-table thead { display: none; }
    .cmp-table, .cmp-table tbody, .cmp-table tr, .cmp-table td { display: block; }
    .cmp-table tr { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; padding: 6px 10px; background: #fff; }
    .cmp-table td { border: none; padding: 2px 0; }
    .cmp-table td::before { content: attr(data-label) ": "; color: var(--text-muted); }
    .cmp-table td.nm::before { content: none; }
  }
  .real-ai-bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 2px; }
  .real-ai-label { font-size: 10.5px; color: var(--text-muted); white-space: nowrap; }
  .real-ai-input {
    padding: 4px 8px;
    border: 1px solid var(--accent);
    border-radius: 7px;
    font-size: 12px;
    min-width: 220px;
    flex: 1 1 240px;
    max-width: 420px;
    background: #fff8f0;
  }
  .real-ai-btn, .real-ai-keybtn, .real-ai-clearbtn {
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #fff;
    border-radius: 6px;
    padding: 4px 9px;
    font-size: 11.5px;
    cursor: pointer;
    white-space: nowrap;
  }
  .real-ai-keybtn { background: none; color: var(--text-muted); border-color: var(--border); }
  .real-ai-clearbtn { background: none; color: #c92a2a; border-color: #c92a2a; }
  .real-ai-feedback { font-size: 10.5px; color: var(--accent-hover); min-height: 12px; flex: 1 1 100%; }
  #chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip {
    border: 1px solid var(--border);
    background: var(--chip-bg);
    color: var(--text);
    border-radius: 18px;
    padding: 3px 10px;
    font-size: 11.5px;
    cursor: pointer;
    white-space: nowrap;
    user-select: none;
    transition: background 0.15s, color 0.15s;
  }
  .chip .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .chip.active { background: var(--chip-active-bg); color: var(--chip-active-text); border-color: var(--chip-active-bg); }
  .chip.ai-highlight { box-shadow: 0 0 0 2px #d97706; }
  .chip.reset, .chip.action { margin-left: 0; background: none; border: 1px solid var(--border); color: var(--text-muted); }
  .chip.reset { text-decoration: underline; border: none; margin-left: auto; }
  .count-badge { font-size: 12px; color: var(--text-muted); margin-left: 4px; }

  main { flex: 1; display: flex; min-height: 0; }
  #map-pane { flex: 1 1 55%; min-width: 280px; }
  #list-pane { flex: 1 1 45%; min-width: 320px; display: flex; flex-direction: column; background: var(--panel); border-left: 1px solid var(--border); }
  .table-scroll { flex: 1; overflow: auto; }

  .route-bar {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: #fff7e6;
    border-bottom: 1px solid #f0c36d;
    font-size: 13px;
    flex-shrink: 0;
  }
  .route-bar button {
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #fff;
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
  }
  .route-bar button.secondary { background: none; color: var(--text-muted); border-color: var(--border); }

  .sort-bar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    padding: 8px 12px; border-bottom: 1px solid var(--border);
    font-size: 11.5px; color: var(--text-muted); flex-shrink: 0;
  }
  .sort-btn {
    border: 1px solid var(--border); background: var(--panel); color: var(--text-muted);
    border-radius: 6px; padding: 3px 9px; font-size: 11.5px; cursor: pointer;
  }
  .sort-btn.sorted { color: var(--text); border-color: var(--accent); font-weight: 600; }
  .sort-btn.sorted::after { content: " " attr(data-dir); }

  .card-list { padding: 0; }
  .empty-note { padding: 24px 16px; text-align: center; color: var(--text-muted); font-size: 13px; }
  .row-card {
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    padding: 10px 12px;
  }
  .row-card:hover { background: #f2f5f1; }
  .row-card.selected { background: #e3ede3; }
  .card-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .card-name { font-weight: 600; font-size: 14px; }
  .card-meta { margin-top: 4px; font-size: 12.5px; }
  .card-addr { margin-top: 2px; font-size: 12px; color: var(--text-muted); }
  .card-note { margin-top: 4px; }
  .visited-tick { color: var(--accent); margin-right: 4px; }
  .note-cell { color: var(--text-muted); font-size: 12px; }
  .my-note-row { display: flex; gap: 5px; margin-top: 4px; align-items: center; }
  .my-note-input {
    flex: 1;
    width: 100%;
    font-size: 11.5px;
    padding: 3px 5px;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    background: #fbfbfa;
  }
  .d4-top { display: flex; align-items: flex-start; gap: 10px; }
  .d4-check { cursor: pointer; flex: 0 0 auto; margin-top: 1px; }
  .d4-check input, .d4-link input { position: absolute; opacity: 0; width: 0; height: 0; }
  .d4-check .box { width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid #b9b9b2; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; color: transparent; background: #fff; transition: all .12s; }
  .d4-check input:checked + .box { background: #2f9e44; border-color: #2f9e44; color: #fff; }
  .d4-check input:focus-visible + .box, .d4-link input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .d4-main { flex: 1; min-width: 0; }
  .d4-stars { flex: 0 0 auto; display: inline-flex; gap: 1px; white-space: nowrap; }
  .d4-star { cursor: pointer; font-size: 19px; line-height: 1; color: #d6d6cf; user-select: none; }
  .d4-star.f { color: #ef9f27; }
  .d4-star:hover { color: #f5c26b; }
  .d4-foot { display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--border); margin-top: 8px; padding-top: 6px; }
  .d4-link { cursor: pointer; }
  .d4-link span { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; color: var(--text-muted); padding: 3px 7px; border-radius: 6px; }
  .d4-link:hover span { background: #eef1ec; }
  .d4-link.route input:checked + span { color: #1971c2; background: #e7f0fb; font-weight: 600; }
  .d4-link.del input:checked + span { color: #c92a2a; background: #fdecec; font-weight: 600; }
  .d4-link.disabled { opacity: .4; cursor: not-allowed; }
  .visit-badge { display: inline-block; font-size: 11.5px; font-weight: 700; color: #1f7a37; background: #e6f5ea; border-radius: 10px; padding: 1px 8px; margin-left: 2px; white-space: nowrap; vertical-align: 1px; }
  .view-seg .vc { opacity: .75; margin-left: 2px; }
  .card-facts { display: flex; flex-wrap: wrap; gap: 4px; margin: 5px 0 0 32px; }
  .fact-pill { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--border); color: var(--text); background: var(--panel); }
  .card-special { margin-top: 5px; font-size: 12px; font-style: italic; color: var(--text-muted); }
  .link-btns { display: inline-flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; margin-left: auto; }
  .web-btn { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600; color: var(--accent); border: 1px solid var(--accent); border-radius: 8px; padding: 5px 10px; text-decoration: none; white-space: nowrap; background: var(--panel); }
  .web-btn:hover { background: #eef1ec; }
  .web-btn.maps { color: #1971c2; border-color: #1971c2; }
  .cuisine-line { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin: 6px 0 0 32px; }
  .cuisine-badge { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; font-size: 13.5px; padding: 2px 10px; border-radius: 12px; background: #eef0ec; color: var(--text); }
  .cuisine-badge.g-restaurant { background: #fdecec; color: #a61e1e; }
  .cuisine-badge.g-cafe { background: #fff0e6; color: #b34700; }
  .cuisine-price { font-weight: 700; font-size: 13.5px; }
  .type-tag {
    display: inline-block;
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 10px;
    background: var(--chip-bg);
    color: var(--text);
    white-space: nowrap;
  }
  .no-loc { color: #b45309; font-size: 11px; }
  .approx-flag { color: #b45309; font-size: 11px; }
  .closed-badge { color: #b45309; font-size: 11.5px; font-weight: 600; }
  .closed-badge a { color: #b45309; }
  .rating-cell { white-space: nowrap; }
  .dist-cell { white-space: nowrap; font-variant-numeric: tabular-nums; }

  .reset-view-btn {
    width: 30px; height: 30px; line-height: 30px; text-align: center;
    background: #fff; border: none; font-size: 17px; cursor: pointer;
    display: block; padding: 0; color: var(--text);
  }
  .reset-view-btn:hover { background: #f4f4f4; }
  .leaflet-popup-content { font-size: 13px; min-width: 180px; }
  .popup-title { font-weight: 700; margin-bottom: 3px; font-size: 14px; }
  .popup-note { color: #6b6b66; font-style: italic; margin-top: 4px; }
  .popup-link { display: inline-block; margin-top: 6px; font-size: 12px; }

  @media (max-width: 860px) {
    main { flex-direction: column; }
    #map-pane { flex: 0 0 45vh; }
    #list-pane { flex: 1; border-left: none; border-top: 1px solid var(--border); }
  }

  @media (max-width: 600px) {
    .search-box, .ai-box, .real-ai-input { flex: 1 1 100%; max-width: 100%; }
    #chips { flex: 1 1 100%; gap: 8px; }
    .chip { font-size: 14px; padding: 8px 16px; }
    .chip .dot { width: 10px; height: 10px; }
    .chip.reset { margin-left: 0; flex: 1 1 100%; text-align: center; padding: 8px 0; }
    .count-badge { flex: 1 1 100%; }
  }
  .filter-toggle, .to-top { display: none; }
  @media (max-width: 600px) {
    #app { height: 100vh; height: 100dvh; }
    header { padding: 6px 10px; gap: 4px; }
    header .sub { display: none; }
    header h1 { font-size: 14px; }
    .stats-bar { margin-left: 6px; font-size: 10px; }
    .view-seg { flex: 1 1 100%; }
    .view-seg button { flex: 1; min-height: 44px; font-size: 13px; padding: 0 6px; }
    .filter-toggle { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-top: 6px; min-height: 44px; padding: 0 14px; font-size: 14px; font-weight: 600; color: var(--text); background: var(--chip-bg); border: 1px solid var(--border); border-radius: 10px; cursor: pointer; }
    .filter-toggle #filterToggleInfo { font-weight: 500; color: var(--accent-hover); }
    header:not(.open) .toolbar, header:not(.open) #aiFeedback, header:not(.open) #realAiBar { display: none; }
    header.open { max-height: 72vh; max-height: 72dvh; overflow-y: auto; }
    main { min-height: 0; }
    #map-pane { flex: 0 0 36dvh; min-height: 160px; }
    #list-pane { min-height: 0; position: relative; }
    .table-scroll { min-height: 0; padding-bottom: 34px; }
    #lockLink { left: 50%; right: auto; transform: translateX(-50%); bottom: 6px; padding: 4px 12px; background: rgba(255,255,255,.92); border-radius: 12px; }
    #tablePane { min-height: 0; }
    .sort-bar { padding: 6px 10px; }
    .d4-check { position: relative; }
    .d4-check::after { content: ''; position: absolute; inset: -12px; }
    .d4-check .box { width: 26px; height: 26px; font-size: 16px; }
    .d4-star { font-size: 26px; padding: 2px 1px; }
    .d4-link span { min-height: 44px; padding: 0 12px; font-size: 14px; }
    .fact-pill { font-size: 13px; padding: 2px 9px; }
    .cuisine-badge, .cuisine-price { font-size: 15px; }
    .cuisine-line, .card-facts { margin-left: 0; }
    .web-btn { min-height: 44px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
    .card-special { font-size: 13px; }
    .d4-foot { gap: 4px; margin-top: 4px; padding-top: 2px; flex-wrap: wrap; }
    .my-note-input { font-size: 14px; padding: 8px; }
    .to-top { position: absolute; left: 10px; bottom: 14px; width: 44px; height: 44px; border-radius: 50%; border: none; background: var(--accent); color: #fff; font-size: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.3); z-index: 500; cursor: pointer; }
    .to-top.show { display: block; }
  }

  #lockScreen {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    z-index: 9999;
  }
  #lockScreen .lock-box {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 28px 32px; max-width: 320px; text-align: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  }
  #lockScreen h2 { margin: 0 0 6px; font-size: 16px; }
  #lockScreen p { margin: 0 0 16px; font-size: 12.5px; color: var(--text-muted); }
  #lockScreen input {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 14px; text-align: center; margin-bottom: 10px; box-sizing: border-box;
  }
  #lockScreen button {
    width: 100%; padding: 8px 10px; border: none; border-radius: 8px;
    background: var(--accent); color: #fff; font-size: 14px; cursor: pointer;
  }
  #lockScreen .lock-error { color: #c92a2a; font-size: 12px; min-height: 16px; margin-top: 8px; }
  #app.locked { display: none; }
  #lockLink { position: fixed; bottom: 8px; right: 10px; font-size: 11px; color: var(--text-muted); z-index: 100; cursor: pointer; }
</style>
</head>
<body>
<div id="lockScreen">
  <div class="lock-box">
    <h2>🔒 Geschützt</h2>
    <p>Bitte Passwort eingeben, um die Karte zu öffnen.</p>
    <input id="lockPassword" type="password" placeholder="Passwort" autocomplete="off" />
    <button id="lockSubmit">Öffnen</button>
    <div class="lock-error" id="lockError"></div>
  </div>
</div>
<span id="lockLink">🔒 sperren</span>
<div id="app" class="locked">
  <header>
    <div>
      <h1>Für Erwachsene – Ausflugsziele-Karte</h1>
      <span class="sub">Fahrzeit ab Schwabach (echte Route) · Stand: 20.10.2026</span>
      <span id="statsBar" class="stats-bar"></span>
      <button id="filterToggle" class="filter-toggle" type="button"><span>☰ Filter und Suche</span><span id="filterToggleInfo">▾</span></button>
    </div>
    <div class="toolbar">
      <input id="aiSearch" class="ai-box" type="text" placeholder="🔎 Was suchst du? z.B. „Restaurant in der Nähe“" />
      <input id="search" class="search-box" type="text" placeholder="…oder Name durchsuchen" />
      <div id="chips"></div>
      <span class="view-seg" id="visitSeg" title="Nach Besuchsstatus filtern">
        <button type="button" data-visit="all" class="on">Alle</button>
        <button type="button" data-visit="visited">✓ Besucht <span class="vc"></span></button>
        <button type="button" data-visit="open">Noch nicht besucht <span class="vc"></span></button>
      </span>
      <label class="chip" id="mapBoundsLabel" for="mapBoundsToggle" title="Liste auf den aktuell sichtbaren Kartenausschnitt beschränken">
        <input type="checkbox" id="mapBoundsToggle" style="margin-right:5px; vertical-align:middle;" />🗺️ Nur Kartenausschnitt
      </label>
      <span id="visibleCount" class="count-badge"></span>
      <span class="view-seg" id="viewSeg">
        <button type="button" data-view="both" class="on">🗺️ Karte + Liste</button>
        <button type="button" data-view="list">📋 Nur Liste</button>
        <button type="button" data-view="table">📊 Tabelle</button>
      </span>
      <button class="chip action" id="exportJson">⬇ JSON</button>
      <button class="chip action" id="exportCsv">⬇ CSV</button>
      <button class="chip reset" id="resetFilters">Filter zurücksetzen</button>
    </div>
    <div id="aiFeedback" class="ai-feedback"></div>
    <div id="realAiBar" class="real-ai-bar">
      <span class="real-ai-label">🤖 Echte KI fragen:</span>
      <input id="realAiInput" class="real-ai-input" type="text" placeholder="z.B. „Was ist im Umkreis von 20 km um München?“" />
      <button id="realAiAsk" class="real-ai-btn">Fragen</button>
      <button id="realAiKeyBtn" class="real-ai-keybtn" title="API-Key setzen/ändern">🔑 Key</button>
      <button id="realAiClear" class="real-ai-clearbtn" style="display:none;">✕ Filter aufheben</button>
      <span id="realAiFeedback" class="real-ai-feedback"></span>
    </div>
  </header>
  <main>
    <div id="map-pane"></div>
    <div id="tablePane"></div>
    <div id="list-pane">
      <button id="toTop" class="to-top" type="button" aria-label="Nach oben">↑</button>
      <div id="routeBar" class="route-bar">
        <span class="route-count">0 Ziele ausgewählt</span>
        <button id="openRouteBtn">Rundtour in Google Maps öffnen ↗</button>
        <button id="clearRouteBtn" class="secondary">Auswahl leeren</button>
      </div>

function escapeHtml(s) {

}

function parseAIQuery(raw) {
  const q = raw.trim().toLowerCase();
  if (!q) return null;

  const result = { groups: null, maxKm: null, country: null, terms: [], sortBy: null, sortDir: 1, explainParts: [] };

  // categories
  const foundGroups = new Set();
  Object.entries(GROUP_KEYWORDS).forEach(([group, words]) => {
    if (words.some(w => q.includes(w))) foundGroups.add(group);
  });
  if (foundGroups.size) {
    result.groups = foundGroups;
    result.explainParts.push("Kategorie: " + Array.from(foundGroups).join(", "));
  }

  // country
  for (const [word, token] of Object.entries(COUNTRY_KEYWORDS)) {
    if (q.includes(word)) { result.country = token; result.explainParts.push("Land: " + word); break; }
  }

  // "unter X km" (matched against real driving distance)
  const kmMatch = q.match(/(\d+)\s*km/);
  if (kmMatch) {
    result.maxKm = parseInt(kmMatch[1], 10);
    result.explainParts.push("max. " + result.maxKm + " km Fahrstrecke");
  }

  // distance intent -> sort by drive time
  if (NEAR_KEYWORDS.some(k => q.includes(k))) {
    result.sortBy = "driveMin"; result.sortDir = 1;
    result.explainParts.push("sortiert nach Fahrzeit");
  }
  // rating intent -> sort by rating desc (wins over distance sort if both mentioned)
  if (RATING_KEYWORDS.some(k => q.includes(k))) {
    result.sortBy = "rating"; result.sortDir = -1;
    result.explainParts.push("sortiert nach Bewertung");
  }

  // remaining free-text tokens (for name/type/note/address matching)
  // strip recognised keywords on whole-word boundaries, longest first, so
  // e.g. "hallenbad" is removed as one word instead of matching the
  // shorter substring "bad" and leaving a meaningless "hallen" fragment.
  const escapeRegex = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const allKeywords = [
    ...Object.values(GROUP_KEYWORDS).flat(),
    ...Object.keys(COUNTRY_KEYWORDS),
    ...NEAR_KEYWORDS,
    ...RATING_KEYWORDS
  ].sort((a, b) => b.length - a.length);

  let rest = q.replace(/\d+\s*km/g, " ");
  allKeywords.forEach(w => {
    rest = rest.replace(new RegExp("\\b" + escapeRegex(w) + "\\b", "gi"), " ");
  });
  const terms = rest.split(/[^a-zäöüß0-9]+/i).filter(t => t.length > 2 && !STOPWORDS.has(t));
  if (terms.length) {
    result.terms = terms;
    if (!result.explainParts.length) result.explainParts.push("Suchbegriff: " + terms.join(", "));
  }

  if (!result.groups && !result.country && result.maxKm == null && !result.terms.length && !result.sortBy) {
    return null; // nothing recognisable, fall back to plain search
  }
  return result;
}

function triggerDownload(filename, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function askRealAI(question) {
  const key = getApiKey();
  const fb = document.getElementById('realAiFeedback');
  const askBtn = document.getElementById('realAiAsk');
  if (!key) {
    fb.textContent = '⚠️ Bitte erst über "🔑 Key" einen Anthropic-API-Key eintragen.';
    return;
  }
  if (!question.trim()) return;
  fb.textContent = 'Frage wird an Claude gesendet…';
  askBtn.disabled = true;
  try {
    const list = DATA
      .map((p, i) => (deletedNames.has(p.name) ? null : `${i}|${p.name}|${p.group}|${p.lat != null ? p.lat : ''}|${p.lon != null ? p.lon : ''}|${(p.addr || '').replace(/\|/g, ' ')}`))
      .filter(Boolean)
      .join('\n');
    const prompt = `Du bekommst eine Liste von Ausflugszielen im Format "Index|Name|Kategorie|Breitengrad|Längengrad|Adresse", eine Zeile pro Ort. Beantworte die folgende Frage AUSSCHLIESSLICH anhand dieser Liste - erfinde keine neuen Orte und nutze kein Wissen über Orte, die nicht in der Liste stehen. Für Umkreis-/Entfernungsfragen berechne die Entfernung selbst per Haversine-Formel aus Breitengrad/Längengrad. Orte ohne Koordinaten kannst du für solche Fragen nicht berücksichtigen. Antworte AUSSCHLIESSLICH mit einem JSON-Array der passenden Indizes, ohne jeden weiteren Text, z.B. [3,17,42]. Wenn nichts passt, antworte mit [].\n\nListe:\n${list}\n\nFrage: ${question}`;

    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 1024,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    if (!res.ok) {
      const errText = await res.text();
      throw new Error(`API-Fehler ${res.status}: ${errText.slice(0, 200)}`);
    }
    const data = await res.json();
    const text = (data.content || []).map(b => b.text || '').join('');
    const match = text.match(/\[[\s\d,]*\]/);
    if (!match) throw new Error('Antwort konnte nicht gelesen werden: ' + text.slice(0, 200));
    const indices = JSON.parse(match[0]);
    const names = new Set(indices.map(i => DATA[i] && DATA[i].name).filter(Boolean));

    externalAiNames = names;
    aiParsed = null;
    document.getElementById('aiSearch').value = '';
    document.getElementById('aiFeedback').textContent = '';
    document.querySelectorAll('.chip[data-group]').forEach(c => c.classList.remove('ai-highlight'));
    fb.textContent = names.size ? `✓ ${names.size} Treffer aus der Liste.` : 'Keine passenden Einträge in der Liste gefunden.';
    document.getElementById('realAiClear').style.display = 'inline-block';
    render();
  } catch (err) {
    fb.textContent = '⚠️ ' + err.message;
  } finally {
    askBtn.disabled = false;
  }
}

function buildRouteUrl() {
  // Always a round trip: Schwabach -> every selected stop, in selection order -> back to Schwabach.
  const pts = routeSelection.map(i => DATA[i]).filter(p => p && p.lat != null);
  if (!pts.length) return null;
  const schwabach = `${SCHWABACH.lat},${SCHWABACH.lon}`;
  const waypoints = pts.map(p => `${p.lat},${p.lon}`).join('|');
  let url = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(schwabach)}&destination=${encodeURIComponent(schwabach)}&travelmode=driving`;
  url += `&waypoints=${encodeURIComponent(waypoints)}`;
  return url;
}
function updateRouteBar() {

  bar.style.display = 'flex';

}

// ---------- Filtering / rendering ----------
function matchesFilter(p) {
  if (deletedNames.has(p.name)) return false;
  if (visitFilter !== 'all' && isVisited(p.name) !== (visitFilter === 'visited')) return false;
  if (mapBoundsFilterActive && viewMode === 'both') {
    if (p.lat == null || p.lon == null) return false;
    if (!map.getBounds().contains([p.lat, p.lon])) return false;
  }
  if (externalAiNames) {
    if (!externalAiNames.has(p.name)) return false;
    if (searchTerm && !p.name.toLowerCase().includes(searchTerm)) return false;
    return true;
  }
  if (aiParsed) {
    if (aiParsed.groups && !aiParsed.groups.has(p.group)) return false;
    if (aiParsed.maxKm != null && (p.driveKm == null || p.driveKm > aiParsed.maxKm)) return false;
    if (aiParsed.country && !(p.addr && p.addr.toLowerCase().includes(aiParsed.country.toLowerCase()))) return false;
    if (aiParsed.terms.length) {
      const hay = (p.name + ' ' + p.type + ' ' + (p.note||'') + ' ' + (p.addr||'')).toLowerCase();
      if (!aiParsed.terms.some(t => hay.includes(t))) return false;
    }
    if (searchTerm && !p.name.toLowerCase().includes(searchTerm)) return false;
    return true;
  }
  if (!activeGroups.has(p.group)) return false;
  if (searchTerm && !p.name.toLowerCase().includes(searchTerm)) return false;
  return true;
}

function cmp(a, b, effKey, effDir) {
  let va = effKey === 'myRating' ? getUserEntry(a.name).myRating : a[effKey];
  let vb = effKey === 'myRating' ? getUserEntry(b.name).myRating : b[effKey];
  if (effKey === 'driveMin' || effKey === 'driveKm') {
    va = va == null ? Infinity : va;
    vb = vb == null ? Infinity : vb;
  } else if (effKey === 'rating' || effKey === 'myRating') {
    va = va == null ? -1 : va;
    vb = vb == null ? -1 : vb;
  } else {
    va = (va || '').toString().toLowerCase();
    vb = (vb || '').toString().toLowerCase();
  }
  if (va < vb) return -1 * effDir;
  if (va > vb) return 1 * effDir;
  return 0;
}

function selectRow(i) {
  selectedIdx = i;
  render();
  const p = DATA[i];
  if (p.lat != null && markers[i]) {
    map.setView([p.lat, p.lon], Math.max(map.getZoom(), 10), { animate: true });
    markers[i].openPopup();
  }
}

  const i = Number(idx);
  const p = DATA[i];
  if (e.target.classList.contains('visited-checkbox')) {
    setUserEntry(p.name, { visited: e.target.checked });
    render();
  } else if (e.target.classList.contains('route-checkbox')) {
    if (e.target.checked) {
      if (routeSelection.length >= 9) {
        e.target.checked = false;
        alert('Maximal 9 Ziele pro Route (Google-Maps-Limit).');
        return;
      }
      routeSelection.push(i);
    } else {
      routeSelection = routeSelection.filter(x => x !== i);
    }
    updateRouteBar();
  } else if (e.target.classList.contains('my-note-input')) {
    setUserEntry(p.name, { myNote: e.target.value });
  } else if (e.target.classList.contains('delete-checkbox')) {
    if (e.target.checked) {
      deleteSelection.push(i);
    } else {
      deleteSelection = deleteSelection.filter(x => x !== i);
    }
    updateDeleteBar();
  }
});

cardList.addEventListener('click', e => {
  const star = e.target.closest('.d4-star');
  if (!star) return;
  const p = DATA[Number(star.dataset.idx)];
  const v = Number(star.dataset.n) * 2;
  const clear = getUserEntry(p.name).myRating === v;
  setUserEntry(p.name, clear ? { myRating: null } : { myRating: v, visited: true });
  render();
});

function render() {
  const effKey = (aiParsed && aiParsed.sortBy) ? aiParsed.sortBy : sortKey;
  const effDir = (aiParsed && aiParsed.sortBy) ? aiParsed.sortDir : sortDir;

  document.querySelectorAll('.sort-btn[data-key]').forEach(btn => {
    btn.classList.toggle('sorted', btn.dataset.key === effKey);
    btn.dataset.dir = effDir === 1 ? '▲' : '▼';
  });

  const indexed = DATA.map((p, i) => ({ p, i })).filter(x => matchesFilter(x.p));
  indexed.sort((a, b) => cmp(a.p, b.p, effKey, effDir));

  markers.forEach((m, i) => {
    if (!m) return;
    const visible = matchesFilter(DATA[i]);
    if (visible && !map.hasLayer(m)) markerGroup.addLayer(m);
    if (!visible && map.hasLayer(m)) markerGroup.removeLayer(m);
  });

  cardList.innerHTML = indexed.length ? '' : `<p class="empty-note">${DATA.length ? 'Keine Einträge für die aktuelle Auswahl.' : 'Noch keine Einträge vorhanden.'}</p>`;
  indexed.forEach(({ p, i }) => {
    const u = getUserEntry(p.name);
    const card = document.createElement('div');
    card.className = 'row-card';
    if (i === selectedIdx) card.classList.add('selected');
    if (u.visited) card.classList.add('visited');

    const ratingTxt = p.rating != null ? `⭐ ${p.rating} (${p.reviews ?? '–'})` : '–';
    const driveTxt = p.driveMin != null
      ? `${formatDuration(p.driveMin)} <span style="color:var(--text-muted);">(${p.driveKm} km)</span>`
      : '<span class="no-loc">Standort unbekannt</span>';
    const locTxt = p.addr ? p.addr.split(',').slice(-3).join(',').trim() : (p.approx ? '<span class="approx-flag">≈ ungefähr</span>' : '–');

    const isClosedNote = p.note && /geschlossen/i.test(p.note);
    let noteHtml = '';
    if (isClosedNote) {
      noteHtml += `<div class="closed-badge">⚠️ ${escapeHtml(p.note)} · <a href="${gmapsLink(p)}" target="_blank" rel="noopener">Status prüfen ↗</a></div>`;
    } else if (p.note) {
      noteHtml += `<div>${escapeHtml(p.note)}</div>`;
    }
    noteHtml += `<div class="my-note-row">
      <input class="my-note-input" data-idx="${i}" placeholder="Eigene Notiz…" value="${escapeHtml(u.myNote)}">
    </div>`;

    // Fakten, Besonderheit, Küchen-Badge: nur wenn Recherchedaten (DETAILS) vorhanden sind.
    // Direktlinks: Google Maps immer, Website des Lokals zusätzlich, wenn bekannt (nebeneinander).
    const det = DETAILS[p.name];
    const food = !!det && (p.group === 'Restaurant' || p.group === 'Café & Bar');
    let factsHtml = '', specialHtml = '', cuisineHtml = '';
    if (det) {
      const labels = TABLE_COLS[p.group] || [];
      const pills = [];
      let price = '';
      labels.slice(0, -1).forEach((l, k) => {
        const v = det['c' + (k + 1)];
        if (v == null || String(v).trim() === '') return;
        if (l === 'Öffnungszeiten') return; // steht nur in der Tabelle
        if (food && l === 'Preisniveau') { price = String(v).trim(); return; }
        if (food && (l === 'Küche' || l === 'Angebot')) return; // Art steht im Badge
        pills.push(`<span class="fact-pill">${l === 'Preisniveau' ? '' : escapeHtml(l) + ': '}${escapeHtml(v)}</span>`);
      });
      if (pills.length) factsHtml = `<div class="card-facts">${pills.join('')}</div>`;
      const sp = labels.length ? det['c' + labels.length] : null;
      if (sp != null && String(sp).trim() !== '') specialHtml = `<div class="card-special">${escapeHtml(sp)}</div>`;
      if (food) {
        const cls = p.group === 'Restaurant' ? 'g-restaurant' : 'g-cafe';
        cuisineHtml = `<div class="cuisine-line"><span class="cuisine-badge ${cls}">${GROUPS[p.group].emoji} ${escapeHtml(p.type)}</span>${price ? `<span class="cuisine-price">${escapeHtml(price)}</span>` : ''}</div>`;
      }
    }
    const hasWeb = !!(det && det.web && /^https?:\/\//.test(det.web));
    const webHtml = `<span class="link-btns">${hasWeb ? `<a class="web-btn" href="${escapeHtml(det.web)}" target="_blank" rel="noopener" title="Website des Lokals">🌐 Website ↗</a>` : ''}<a class="web-btn maps" href="${gmapsLink(p)}" target="_blank" rel="noopener" title="Im Google-Maps-Eintrag öffnen">📍 Google Maps ↗</a></span>`;

    const starsFilled = u.myRating != null ? Math.ceil(u.myRating / 2) : 0;
    const starsHtml = [1, 2, 3, 4, 5].map(n => `<span class="d4-star${n <= starsFilled ? ' f' : ''}" data-idx="${i}" data-n="${n}">★</span>`).join('');
    card.innerHTML = `
      <div class="d4-top">
        <label class="d4-check" title="Besucht"><input type="checkbox" class="visited-checkbox" data-idx="${i}" ${u.visited ? 'checked' : ''}><span class="box">✓</span></label>
        <div class="d4-main">
          <span class="card-name">${escapeHtml(p.name)}</span>${u.visited ? `<span class="visit-badge" title="Besucht">✓ Besucht${u.myRating != null ? ' · ' + u.myRating + '/10' : ''}</span>` : ''}
          ${food ? '' : `<span class="type-tag">${escapeHtml(p.type)}</span>`}
          <div class="card-meta">${ratingTxt} &nbsp;·&nbsp; ${driveTxt}</div>
          <div class="card-addr">${locTxt}</div>
        </div>
        <span class="d4-stars" title="${u.myRating != null ? 'Meine Wertung: ' + u.myRating + '/10' : 'Eigene Wertung vergeben'}">${starsHtml}</span>
      </div>
      ${cuisineHtml}
      ${factsHtml}
      ${specialHtml}
      <div class="card-note">${noteHtml}</div>
      <div class="d4-foot">
        <label class="d4-link route${p.lat == null ? ' disabled' : ''}" title="Für Routenplanung auswählen"><input type="checkbox" class="route-checkbox" data-idx="${i}" ${routeSelection.includes(i) ? 'checked' : ''} ${p.lat == null ? 'disabled' : ''}><span>🧭 Zur Route</span></label>
        <label class="d4-link del" title="Zum Löschen markieren"><input type="checkbox" class="delete-checkbox" data-idx="${i}" ${deleteSelection.includes(i) ? 'checked' : ''}><span>🗑 Löschen</span></label>
        ${webHtml}
      </div>
    `;
    card.addEventListener('click', e => {
      if (e.target.tagName === 'INPUT' || e.target.closest('label') || e.target.closest('a') || e.target.closest('.d4-stars')) return; // don't hijack checkbox/input/star clicks
      selectRow(i);
    });
    cardList.appendChild(card);
  });

  const activeTotal = DATA.length - deletedNames.size;
  document.getElementById('visibleCount').textContent = `${indexed.length} / ${activeTotal} Orte`;

  const visitedCount = DATA.filter(p => !deletedNames.has(p.name) && getUserEntry(p.name).visited).length;
  const vcs = document.querySelectorAll('#visitSeg .vc');
  vcs[0].textContent = '(' + visitedCount + ')';
  vcs[1].textContent = '(' + (activeTotal - visitedCount) + ')';
  document.getElementById('statsBar').textContent =
    `· 📍 ${activeTotal} Orte gesamt · ✅ ${visitedCount} besucht · ⬜ ${activeTotal - visitedCount} noch nicht besucht`;

  updateRouteBar();
  updateDeleteBar();
  updateFilterToggle();
  if (tableMode) renderTable();
}

    const heads = [['name', 'Name'], ['driveMin', 'Fahrzeit'], ['rating', 'Bewertung']]
      .concat(labels.map((l, i) => ['c' + (i + 1), l]));
    html += `<div class="cmp-title">${GROUPS[g].emoji} ${escapeHtml(g)} <span style="font-weight:400;color:var(--text-muted)">(${rows.length})</span></div>`;
    html += '<table class="cmp-table"><thead><tr>' + heads.map(([k, l]) =>
      `<th data-key="${k}" class="${tableSort.key === k ? 'sorted' : ''}">${escapeHtml(l)}${tableSort.key === k ? (tableSort.dir === 1 ? ' ▲' : ' ▼') : ''}</th>`).join('') + '</tr></thead><tbody>';
    rows.forEach(p => {
      const d = DETAILS[p.name] || {};
      const src = d.src && /^https?:\/\//.test(d.src) ? `<a class="src" href="${escapeHtml(d.src)}" target="_blank" rel="noopener" title="Quelle">ⓘ</a>` : '';
      const cell = (label, v) => `<td data-label="${escapeHtml(label)}">${v == null || v === '' ? '<span class="na">–</span>' : escapeHtml(v)}</td>`;
      html += `<tr><td class="nm"><a href="${gmapsLink(p)}" target="_blank" rel="noopener">${escapeHtml(p.name)}</a>${src}</td>`
        + cell('Fahrzeit', p.driveMin != null ? `${formatDuration(p.driveMin)} (${p.driveKm} km)` : null)
        + cell('Bewertung', p.rating != null ? `⭐ ${p.rating} (${p.reviews ?? '–'})` : null)
        + labels.map((l, i) => cell(l, d['c' + (i + 1)])).join('') + '</tr>';
    });
    html += '</tbody></table>';
  });
  if (!any) html += '<p>Keine Einträge für die aktuelle Auswahl.</p>';
  document.getElementById('tablePane').innerHTML = html;
}
document.getElementById('tablePane').addEventListener('click', e => {
  const th = e.target.closest('th[data-key]');
  if (!th) return;
  const k = th.dataset.key;
  if (tableSort.key === k) tableSort.dir *= -1; else tableSort = { key: k, dir: 1 };
  renderTable();
});
const VIEW_KEY = 'adultmap_view_v1';
function setView(v) {
  viewMode = v;
  tableMode = v === 'table';
  document.body.classList.toggle('table-mode', tableMode);
  document.body.classList.toggle('list-only', v === 'list');
  document.querySelectorAll('#viewSeg button').forEach(b => b.classList.toggle('on', b.dataset.view === v));
  try { localStorage.setItem(VIEW_KEY, v); } catch (e) {}
  render();
  if (v === 'both') setTimeout(() => map.invalidateSize(), 50);
}
document.querySelectorAll('#viewSeg button').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));

render();
try { const sv = localStorage.getItem(VIEW_KEY); if (sv === 'list' || sv === 'table') setView(sv); } catch (e) {}

// ---------- Lock screen (deterrent only, not real security) ----------
const LOCK_B64 = 'MTIzNDU2Nzg=';
const LOCK_KEY = 'adultmap_unlocked_v1';

function showApp() {
  document.getElementById('lockScreen').style.display = 'none';
  document.getElementById('app').classList.remove('locked');
  setTimeout(() => map.invalidateSize(), 50);
}
function lockApp() {
  try { localStorage.removeItem(LOCK_KEY); } catch (e) {}
  document.getElementById('lockScreen').style.display = 'flex';
  document.getElementById('app').classList.add('locked');
  document.getElementById('lockPassword').value = '';
}
(() => {
  let alreadyUnlocked = false;
  try { alreadyUnlocked = localStorage.getItem(LOCK_KEY) === '1'; } catch (e) {}
  if (alreadyUnlocked) showApp();
})();
document.getElementById('lockSubmit').addEventListener('click', () => {
  const val = document.getElementById('lockPassword').value;
  if (btoa(val) === LOCK_B64) {
    try { localStorage.setItem(LOCK_KEY, '1'); } catch (e) {}
    document.getElementById('lockError').textContent = '';
    showApp();
  } else {
    document.getElementById('lockError').textContent = 'Falsches Passwort.';
  }
});
document.getElementById('lockPassword').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('lockSubmit').click();
});
document.getElementById('lockLink').addEventListener('click', lockApp);
</script>
